<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gear manifest - Marswalk Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="kit.css" rel="stylesheet" />
</head>
<body>

<header class="top">
  <a class="brand" href="/"><span class="mark" aria-hidden="true"></span>Marswalk <em>Gear manifest</em></a>
  <nav class="tabs" role="tablist" aria-label="Kit source">
    <button role="tab" id="tabBuild" aria-selected="true">Build a kit</button>
    <button role="tab" id="tabPublished" aria-selected="false">Planner's kit <span id="pubDot" class="dot" hidden></span></button>
  </nav>
  <a class="back" href="/">Planner map</a>
</header>

<div class="shell">
  <aside class="rail" id="rail">
    <form id="form" autocomplete="off">
      <section>
        <h2>Mission</h2>
        <label for="archetype">Type</label>
        <select id="archetype"></select>
        <p class="hint" id="archetypeHint"></p>
        <div class="pair">
          <div><label for="crew">Crew on surface</label>
            <select id="crew"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
          <div><label for="stay">Stay (sols)</label><input id="stay" type="number" min="1" max="1100" step="1" value="30" /></div>
        </div>
        <div class="pair">
          <div><label for="evaHours">EVA length (h)</label><input id="evaHours" type="number" min="1" max="12" step="0.5" value="6" /></div>
          <div><label for="power">Power</label>
            <select id="power"><option value="battery">Battery</option><option value="solar">Solar</option><option value="fission">Fission</option></select></div>
        </div>
      </section>

      <section>
        <h2>Goals</h2>
        <div class="chips" id="goals"></div>
      </section>

      <section>
        <h2>Site hazards</h2>
        <div class="chips" id="hazards"></div>
      </section>

      <section>
        <h2>Route</h2>
        <label class="check"><input type="checkbox" id="useRoute" checked /> Read the terrain along a planned route</label>
        <div id="routeFields">
          <label for="region">Region</label><select id="region"></select>
          <label for="vehicle">Traveller</label><select id="vehicle"></select>
          <label for="base">Base</label><select id="base"></select>
          <div class="pair coords"><input id="baseLat" aria-label="Base latitude" inputmode="decimal" /><input id="baseLon" aria-label="Base longitude" inputmode="decimal" /></div>
          <label for="target">Target</label><select id="target"></select>
          <div class="pair coords"><input id="targetLat" aria-label="Target latitude" inputmode="decimal" /><input id="targetLon" aria-label="Target longitude" inputmode="decimal" /></div>
          <div class="pair">
            <div><label for="hour">Local hour</label><input id="hour" type="number" min="0" max="24" step="0.25" value="11" /></div>
            <div><label for="budget">EVA budget (h)</label><input id="budget" type="number" min="1" max="12" step="0.5" value="8" /></div>
          </div>
        </div>
      </section>

      <button type="submit" class="go" id="go">Build kit</button>
    </form>
    <p class="rail-note" id="railNote" hidden>Showing the kit the planning agent published. The form is for building your own.</p>
  </aside>

  <main class="sheet" id="sheet" aria-live="polite">
    <p class="empty">Loading.</p>
  </main>
</div>

<script src="kit.js"></script>
</body>
</html>
