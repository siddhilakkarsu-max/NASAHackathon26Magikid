<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marswalk Planner</title>
<script>window.CESIUM_BASE_URL = "/vendor/Cesium/";</script>
<script src="/vendor/Cesium/Cesium.js"></script>
<script src="/weather_display.js"></script>
<script src="/weather_timeline.js"></script>
<script src="/wind_motion.js"></script>
<script src="/temperature_view.js"></script>
<link href="/vendor/Cesium/Widgets/widgets.css" rel="stylesheet" />
<style>
  /* Designers: restyle freely. Everything visual lives in this file. */
  :root { --bg: rgba(18, 12, 10, 0.88); --fg: #f3e7dd; --accent: #e0703a; --muted: #b9a79a; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #000; }
  body { display: grid; grid-template-columns: min(310px, 34vw) minmax(0, 1fr); }
  #map { grid-area: 1 / 2; min-width: 0; min-height: 0; overflow: hidden; position: relative; }
  #panel { grid-area: 1 / 1; min-height: 0; overflow: auto;
           background: var(--bg); color: var(--fg); padding: 14px; font-size: 13px; z-index: 10; }
  h1 { font-size: 17px; margin: 0 0 8px; color: var(--accent); }
  h2 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  label { display: block; margin: 6px 0 2px; }
  select, input[type=range], button { width: 100%; }
  button { margin-top: 6px; padding: 7px; border: 0; border-radius: 6px; background: var(--accent); color: white; cursor: pointer; }
  button.secondary { background: #4a3a33; }
  button.active { outline: 2px solid white; }
  .row { display: flex; gap: 6px; } .row > * { flex: 1; }
  #info, #explain, #warn { white-space: pre-wrap; line-height: 1.4; }
  #warn { color: #ffb08a; }
  #legend { height: 10px; border-radius: 4px; margin-top: 4px; }
  .legend-ticks { display: flex; justify-content: space-between; margin: 3px 0 6px; color: var(--fg); }
  .legend-note, #legendText a { display: block; margin: 3px 0; }
  #legendText a { color: #b9daf0; }
  #layerStatus { color: #ffcaac; margin: 4px 0; }
  #layerStatus:empty, #mapDetail:empty { display: none; }
  #mapDetail { margin: 4px 0; }
  #mapOpacity:disabled { opacity: 0.45; }
  #timeline { margin-top: 12px; }
  #timeline input[type=number] { box-sizing: border-box; width: 100%; }
  #timelineReadout { display: block; margin-top: 8px; color: var(--fg); }
  #timelineMessage { margin: 4px 0; }
  #panel a { color: #b9daf0; }
  #weatherHover { position: absolute; z-index: 5; pointer-events: none; max-width: 210px;
                  padding: 7px 9px; background: #131520ed; color: #fff; font-size: 12px;
                  line-height: 1.45; border: 1px solid #ffffff48; border-radius: 5px; }
  .small { color: var(--muted); font-size: 11px; }
  @media (max-width: 600px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 55% minmax(0, 1fr); }
    #map { grid-area: 1 / 1; }
    #panel { grid-area: 2 / 1; }
  }

  /* Consumables readout — one block reused by every traveller */
  .cons { margin-top: 8px; }
  .cons-spec { color: var(--muted); font-size: 11px; line-height: 1.4; }
  .crow { margin-top: 9px; }
  .crow .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .crow .nm { color: var(--fg); }
  .crow .val { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .crow .val b { color: var(--fg); }
  .bar { height: 7px; border-radius: 4px; background: #3a2c25; overflow: hidden; margin-top: 5px; }
  .bar > i { display: block; height: 100%; border-radius: 4px; width: 0;
             background: linear-gradient(90deg, #8f4526, var(--accent)); transition: width .3s ease; }
  .crow.over .nm, .crow.over .val { color: #ff8f78; }
  .crow.over .bar > i { background: linear-gradient(90deg, #b03a2e, #ff6b52); }
  .cons-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px;
               margin-top: 10px; color: var(--muted); font-size: 11px; }
  .chip { display: inline-block; padding: 2px 7px; border-radius: 999px; background: #4a3a33;
          color: var(--fg); font-size: 11px; white-space: nowrap; }
  .chip.over { background: #6d2b22; color: #ffd9cf; }
</style>
</head>
<body>
<div id="map"><div id="weatherHover" aria-hidden="true" hidden></div></div>
<div id="panel">
  <h1>Marswalk Planner</h1>
  <div class="small" id="status">Connecting to back end…</div>

  <h2>Conditions</h2>
  <label>Region <select id="region"></select></label>
  <label>Who is travelling <select id="vehicle"></select></label>
  <label>Local solar time: <b id="hourVal"></b></label>
  <input type="range" id="hour" min="0" max="24" step="0.25" value="11" />
  <label>Season (Ls): <b id="lsVal"></b></label>
  <input type="range" id="ls" min="0" max="360" step="0.1" value="90" />
  <label>EVA budget (hours): <b id="budgetVal"></b></label>
  <input type="range" id="budget" min="1" max="12" step="0.5" value="4" />

  <h2>Map layer</h2>
  <div class="row">
    <button id="wholeMars" class="secondary" type="button">Whole Mars</button>
    <button id="zoomRegion" class="secondary" type="button">Zoom to region</button>
  </div>
  <select id="layer">
    <option value="">(none)</option>
    <option value="imagery">CTX image (6 m, sharp)</option>
    <option value="slope">Slope</option>
    <option value="firmness">Ground firmness (THEMIS night)</option>
    <option value="cost">Travel cost</option>
    <option value="illumination">Sunlight on slopes</option>
    <option value="temperature">Regional simulated surface temperature</option>
    <optgroup label="Global weather">
      <option value="global_temperature" selected>Global simulated surface temperature</option>
      <option value="openmars_surface_temperature">OpenMARS ground temperature reference</option>
      <option value="air_temperature">Near-surface air temperature</option>
      <option value="surface_pressure">Surface pressure</option>
      <option value="wind_speed">Near-surface wind speed</option>
      <option value="wind_direction">Near-surface wind arrows</option>
      <option value="dust_opacity">Atmospheric dust optical depth</option>
    </optgroup>
    <option value="shelter">Minutes to shelter</option>
    <option value="elevation">Elevation</option>
  </select>
  <div id="legend" hidden></div><div class="small" id="legendText"></div>
  <div id="mapDetail" class="small" role="status"></div>
  <label for="mapOpacity">Overlay opacity <output id="opacityValue" for="mapOpacity">100%</output></label>
  <input id="mapOpacity" type="range" min="0" max="100" value="100" step="5" disabled>
  <div class="small" id="layerStatus" role="status"></div>
  <button id="retryLayer" class="secondary" type="button" hidden>Retry layer</button>
  <button id="pauseWind" class="secondary" type="button" hidden>Pause wind motion</button>
  <section id="timeline" hidden aria-label="Weather timeline">
    <h2>Weather timeline</h2>
    <div class="small" id="timelineNote"></div>
    <div class="row">
      <label>Start sol <input id="startSol" type="number" step="1" required></label>
      <label>End sol <input id="endSol" type="number" step="1" required></label>
    </div>
    <button id="playTimeline" class="secondary" type="button">Play timeline</button>
    <label id="timelineReadout" for="timelinePosition">Timeline position</label>
    <input id="timelinePosition" type="range" step="1">
    <div class="small" id="timelineMessage" role="status"></div>
  </section>
  <p class="small"><a href="/api/weather/sources" target="_blank" rel="noopener">Weather data and source inventory</a></p>

  <h2>Plan a walk</h2>
  <div class="row">
    <button id="setBase" class="secondary">Set base</button>
    <button id="setTarget" class="secondary">Set target</button>
  </div>
  <select id="targets"><option value="">…or pick a science target</option></select>
  <button id="plan">Plan route</button>
  <div id="warn"></div>

  <h2>Consumables</h2>
  <div id="consumes" class="cons small"></div>

  <div id="explain"></div>

  <h2>Clicked point</h2>
  <div id="info" class="small">Click the map to see every value stored in that pixel.</div>
</div>

<script>
// ------------------------------------------------------------ settings ----
const API = "";                       // same server. If the front end is hosted elsewhere: "http://localhost:8000"
const ION_TOKEN = "";                 // optional: Cesium ion token for the Cesium Mars 3D tileset
const CESIUM_MARS_ASSET_ID = null;    // optional: asset id of "Cesium Mars" from your ion Asset Depot
// NASA Trek tiles are fetched through our back end (Trek does not allow direct browser access)
const TREK = API + "/tiles/Mars_Viking_MDIM21_ClrMosaic_global_232m";

if (!window.Cesium) {
  document.getElementById("status").textContent = "The globe renderer could not load. Refresh this page.";
  throw new Error("CesiumJS did not load");
}
const MARS = Cesium.Ellipsoid.MARS;
Cesium.Ellipsoid.default = MARS;
const $ = (id) => document.getElementById(id);

const marsTiles = new Cesium.UrlTemplateImageryProvider({
  url: TREK + "/{z}/{y}/{x}.jpg",
  tilingScheme: new Cesium.GeographicTilingScheme({ ellipsoid: MARS }),
  maximumLevel: 7, credit: "NASA/JPL Mars Trek, Viking MDIM 2.1",
});
marsTiles.errorEvent.addEventListener(error => { error.retry = false; });
const baseMap = Cesium.ImageryLayer.fromProviderAsync(
  Cesium.SingleTileImageryProvider.fromUrl("/viking-mdim.jpg", {
    ellipsoid: MARS, credit: "NASA/JPL Mars Trek, Viking MDIM 2.1",
  })
);
const viewer = new Cesium.Viewer("map", {
  globe: new Cesium.Globe(MARS),
  baseLayer: baseMap,
  baseLayerPicker: false, geocoder: false, timeline: false, animation: false,
  sceneModePicker: false, homeButton: false, navigationHelpButton: false, infoBox: false, selectionIndicator: false,
});
viewer.imageryLayers.addImageryProvider(marsTiles);
if (viewer.scene.skyAtmosphere) viewer.scene.skyAtmosphere.show = false;
if (viewer.scene.globe) viewer.scene.globe.showGroundAtmosphere = false;
if (viewer.scene.skyBox) viewer.scene.skyBox.show = false;
if (viewer.scene.sun) viewer.scene.sun.show = false;
if (viewer.scene.moon) viewer.scene.moon.show = false;
viewer.scene.backgroundColor = Cesium.Color.BLACK;

let tileset = null;
(async () => {
  if (ION_TOKEN && CESIUM_MARS_ASSET_ID) {
    Cesium.Ion.defaultAccessToken = ION_TOKEN;
    tileset = await Cesium.Cesium3DTileset.fromIonAssetId(CESIUM_MARS_ASSET_ID);
    viewer.scene.primitives.add(tileset);
    viewer.scene.globe.show = false;
  }
})();

// ---------------------------------------------------------------- state ----
let regions = [], current = null, overlay = [], mode = null;
let base = null, target = null, layerRequest = 0;
let layerLoad = null, displayedLayer = "";
let timeline = null, shownConditions = null, shownResponse = null;
let hoverPoint = null, hoverTimer, hoverLoad, hoverVersion = 0;
let windPaused = matchMedia("(prefers-reduced-motion: reduce)").matches;
let pointRequest = 0;
const marks = viewer.entities;
const imageLayers = () => tileset ? tileset.imageryLayers : viewer.imageryLayers;
const mapOpacity = () => +$("mapOpacity").value / 100;
const temperatureView = createTemperatureView({
  viewer, ellipsoid: MARS, api, opacity: mapOpacity,
  current: () => displayedLayer === "global_temperature" && overlay.length
    ? { overview: overlay[0], conditions: shownConditions, collection: imageLayers() } : null,
  onChange: (state, step, range) => {
    if (displayedLayer !== "global_temperature") return;
    $("mapDetail").textContent = {
      overview: "0.5° overview · Zoom in for finer TES inputs",
      loading: "Loading finer TES inputs for this view…",
      detail: `${step}° TES detail · This view only`,
      unavailable: "Finer view unavailable · Showing the 0.5° overview",
    }[state];
    if (state !== "loading") {
      const response = state === "detail" ? { ...shownResponse, temperature_range: range, viewport: true } : shownResponse;
      weatherDisplay.renderLegend({ bar: $("legend"), text: $("legendText"), name: displayedLayer, response });
      refreshHover();
    }
  },
});

$("mapOpacity").oninput = () => {
  const opacity = mapOpacity();
  $("opacityValue").textContent = $("mapOpacity").value + "%";
  for (const layer of overlay) layer.alpha = opacity;
  temperatureView.setOpacity(opacity);
  const wind = $("map").querySelector(".wind-motion");
  if (wind) wind.style.opacity = opacity;
};
const SPECS = {};        // vehicle -> limits, filled from /api/regions
let lastPlan = null;     // stats from the last plan; null = nothing current to show
let replanHint = "";
let planRequest = 0, planBusy = false;

function conditions() {
  return { region: $("region").value || "jezero", vehicle: $("vehicle").value || "astronaut", local_hour: +$("hour").value,
           ls: +$("ls").value, budget_hours: +$("budget").value };
}
function labels() {
  const h = +$("hour").value;
  $("hourVal").textContent = `${Math.floor(h)}:${String(Math.round((h % 1) * 60)).padStart(2, "0")}`;
  $("lsVal").textContent = `${+$("ls").value}°`;
  $("budgetVal").textContent = $("budget").value;
}

async function api(path, body, signal) {
  const options = body ? { method: "POST", headers: { "Content-Type": "application/json" },
                           body: JSON.stringify(body), signal } : { signal };
  const r = await fetch(API + path, options);
  if (!r.ok) {
    const error = await r.json().catch(() => ({}));
    throw new Error(typeof error.detail === "string" ? error.detail : `Request failed (${r.status}).`);
  }
  return r.json();
}

// -------------------------------------------------------------- overlays ----
async function showImage(dataUrl, rect, request = layerRequest, isCurrent = () => true) {
  const provider = await Cesium.SingleTileImageryProvider.fromUrl(dataUrl, {
    ellipsoid: MARS,
    rectangle: Cesium.Rectangle.fromDegrees(rect.west, rect.south, rect.east, rect.north) });
  if (request !== layerRequest || !isCurrent()) return false;
  clearOverlay();
  const layer = new Cesium.ImageryLayer(provider);
  layer.alpha = mapOpacity();
  imageLayers().add(layer);
  overlay.push(layer);
  $("mapOpacity").disabled = false;
  return true;
}
function clearOverlay() {
  temperatureView.clear();
  for (const l of overlay) imageLayers().remove(l, true);
  overlay = [];
  displayedLayer = "";
  shownConditions = null;
  shownResponse = null;
  $("mapOpacity").disabled = true;
  $("mapDetail").textContent = "";
}

async function refreshLayer() {
  const request = ++layerRequest;
  const name = $("layer").value;
  layerLoad?.abort();
  $("layerStatus").textContent = "";
  $("retryLayer").hidden = true;
  const guide = { bar: $("legend"), text: $("legendText"), name };
  if (name !== displayedLayer || !name) {
    clearOverlay();
    windMotion.stop();
    updateWindControl();
    refreshHover();
    weatherDisplay.renderLegend(guide);
  }
  if (!name) return false;
  const load = new AbortController();
  layerLoad = load;
  $("layerStatus").textContent = "Loading layer…";
  try {
    const snapshot = conditions();
    const response = await api(`/api/layer/${name}`, snapshot, load.signal);
    if (request !== layerRequest || !await showImage(response.image, response.rect, request)) return false;
    let animated = false;
    if (response.wind_field) {
      animated = windMotion.start({ viewer, container: $("map"), vectors: response.wind_field });
      if (animated) {
        windMotion.setPaused(windPaused);
        $("map").querySelector(".wind-motion").style.opacity = mapOpacity();
      }
    }
    if (!animated && response.wind_vectors) {
      const fallback = await weatherDisplay.renderWind(response);
      if (request !== layerRequest || !await showImage(fallback, response.rect, request)) return false;
    }
    displayedLayer = name;
    shownConditions = snapshot;
    shownResponse = response;
    updateWindControl(animated);
    weatherDisplay.renderLegend({ ...guide, response });
    if (name === "global_temperature") {
      $("mapDetail").textContent = "0.5° overview · Zoom in for finer TES inputs";
      temperatureView.refresh();
    } else if (response.grid_step_deg) {
      $("mapDetail").textContent = `${response.grid_step_deg}° data grid` +
        (response.weather ? " · Zoom magnifies this grid" : "");
    }
    $("layerStatus").textContent = "";
    refreshHover();
    return true;
  } catch (error) {
    if (request !== layerRequest || error.name === "AbortError") return false;
    clearOverlay();
    windMotion.stop();
    updateWindControl();
    refreshHover();
    weatherDisplay.renderLegend(guide);
    $("layerStatus").textContent = `Layer could not load. ${error.message}`;
    $("retryLayer").hidden = false;
    return false;
  }
}
$("retryLayer").onclick = refreshLayer;
function updateWindControl(available = false) {
  $("pauseWind").hidden = !available;
  $("pauseWind").textContent = windPaused ? "Resume wind motion" : "Pause wind motion";
}
$("pauseWind").onclick = () => {
  windPaused = !windPaused;
  windMotion.setPaused(windPaused);
  updateWindControl(true);
};

// --------------------------------------------------------------- picking ----
function pickLatLon(pos) {
  const cart = (tileset && viewer.scene.pickPositionSupported && viewer.scene.pickPosition(pos))
            || viewer.camera.pickEllipsoid(pos, MARS);
  if (!cart) return null;
  const c = Cesium.Cartographic.fromCartesian(cart, MARS);
  return { lat: Cesium.Math.toDegrees(c.latitude), lon: Cesium.Math.toDegrees(c.longitude) };
}

function pointLabel({lat, lon}) {
  return `${Math.abs(lat).toFixed(2)}° ${lat < 0 ? "S" : "N"}, ${Math.abs(lon).toFixed(2)}° ${lon < 0 ? "W" : "E"}`;
}
const hoverLayers = new Set(["temperature", "global_temperature", "openmars_surface_temperature", "air_temperature", "surface_pressure",
                              "wind_speed", "wind_direction", "dust_opacity"]);
function paintHover(point, detail = "") {
  const tip = $("weatherHover");
  tip.replaceChildren(document.createTextNode(pointLabel(point)));
  if (detail) {
    const value = document.createElement("div");
    value.textContent = detail;
    tip.append(value);
  }
  tip.hidden = false;
  const map = $("map");
  tip.style.left = Math.max(0, Math.min(point.x + 13, map.clientWidth - tip.offsetWidth - 5)) + "px";
  tip.style.top = Math.max(0, Math.min(point.y + 14, map.clientHeight - tip.offsetHeight - 5)) + "px";
}
function refreshHover() {
  ++hoverVersion;
  clearTimeout(hoverTimer);
  hoverTimer = undefined;
  hoverLoad?.abort();
  hoverLoad = null;
  if (hoverPoint) {
    hoverPoint.detail = undefined;
    paintHover(hoverPoint);
    queueHover();
  }
}
function hoverCell(point, layer) {
  const step = layer === "global_temperature" ? temperatureView.stepAt(point) ?? 0.5
    : layer === "temperature" ? 0.5 : 5;
  return `${step}:${Math.floor((90 - point.lat) / step)}:${Math.floor(((point.lon + 180) % 360) / step)}`;
}
function samplePoint(layer, snapshot, point, signal) {
  return api(`/api/layer/${layer}/sample`, {
    ...snapshot, lat: point.lat, lon: point.lon, detail: layer === "global_temperature" && !!temperatureView.stepAt(point),
  }, signal);
}
function sampleLabel(sample) {
  const value = sample.value === null ? "unavailable" : `${sample.value} ${sample.unit}`;
  const direction = sample.toward_deg === undefined ? "" : ` · toward ${sample.toward_deg}°`;
  return `${sample.label} ${value}${direction}`;
}
function queueHover() {
  if (hoverTimer || hoverLoad || !hoverPoint || !shownConditions || !hoverLayers.has(displayedLayer)) return;
  hoverTimer = setTimeout(async () => {
    hoverTimer = undefined;
    if (!hoverPoint) return;
    const point = hoverPoint, snapshot = shownConditions, layer = displayedLayer, version = hoverVersion;
    const pending = new AbortController();
    hoverLoad = pending;
    try {
      const sample = await samplePoint(layer, snapshot, point, pending.signal);
      if (!hoverPoint || version !== hoverVersion || layer !== displayedLayer || snapshot !== shownConditions) return;
      if (hoverCell(point, layer) !== hoverCell(hoverPoint, layer)) {
        hoverLoad = null;
        queueHover();
        return;
      }
      hoverPoint.detail = sampleLabel(sample);
      paintHover(hoverPoint, hoverPoint.detail);
    } catch (error) {
      if (error.name !== "AbortError" && version === hoverVersion && hoverPoint) {
        paintHover(hoverPoint, "Value could not load");
      }
    } finally {
      if (hoverLoad === pending) hoverLoad = null;
    }
  }, 115);
}
function hideHover() {
  hoverPoint = null;
  $("weatherHover").hidden = true;
  refreshHover();
}
$("map").addEventListener("pointerleave", hideHover);
viewer.scene.canvas.addEventListener("pointermove", event => {
  if (event.pointerType === "touch" || event.buttons) { hideHover(); return; }
  const bounds = viewer.scene.canvas.getBoundingClientRect();
  const x = event.clientX - bounds.left, y = event.clientY - bounds.top;
  const location = pickLatLon(new Cesium.Cartesian2(x, y));
  if (!location) { hideHover(); return; }
  const previous = hoverPoint;
  hoverPoint = { ...location, x, y };
  if (previous && hoverCell(previous, displayedLayer) === hoverCell(hoverPoint, displayedLayer)) {
    hoverPoint.detail = previous.detail;
  }
  paintHover(hoverPoint, hoverPoint.detail);
  if (!hoverPoint.detail) queueHover();
});
function pin(id, p, color, text) {
  marks.removeById(id);
  marks.add({ id, position: Cesium.Cartesian3.fromDegrees(p.lon, p.lat, 0, MARS),
    point: { pixelSize: 12, color, outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
             heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: 1e9 },
    label: { text, font: "13px sans-serif", pixelOffset: new Cesium.Cartesian2(0, -20),
             disableDepthTestDistance: 1e9 } });
}

new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas).setInputAction(async (e) => {
  const p = pickLatLon(e.position); if (!p) return;
  const request = ++pointRequest;
  if (!mode && shownConditions && hoverLayers.has(displayedLayer)) {
    const layer = displayedLayer, snapshot = shownConditions;
    $("info").textContent = pointLabel(p);
    try {
      const sample = await samplePoint(layer, snapshot, p);
      if (request !== pointRequest || snapshot !== shownConditions) return;
      $("info").textContent = `${pointLabel(p)}\n${sampleLabel(sample)}\nData grid ${sample.grid_step_deg}° · ${snapshot.local_hour} h local solar time · ${snapshot.ls}° Ls`;
    } catch (err) {
      if (request === pointRequest) $("info").textContent = `${pointLabel(p)}\n${err.message}`;
    }
    return;
  }
  if (mode === "base")   { base = p;   pin("base", p, Cesium.Color.DODGERBLUE, "Base"); invalidatePlan(); }
  if (mode === "target") { target = p; pin("target", p, Cesium.Color.ORANGE, "Target"); invalidatePlan(); }
  mode = null; $("setBase").classList.remove("active"); $("setTarget").classList.remove("active");
  try {
    const px = await api(`/api/pixel?lat=${p.lat}&lon=${p.lon}&region=${$("region").value}`);
    if (request !== pointRequest) return;
    const lines = Object.entries(px.values).map(([k, v]) => `${k.padEnd(13)} ${v ?? "no data"}`);
    $("info").textContent = `${p.lat.toFixed(4)}°N  ${p.lon.toFixed(4)}°E\n` +
      (px.ground ? `ground: ${px.ground}\n` : "") + `confidence: ${px.confidence}\n\n` + lines.join("\n");
  } catch (err) { if (request === pointRequest) $("info").textContent = `${pointLabel(p)}: ${err.message}`; }
}, Cesium.ScreenSpaceEventType.LEFT_CLICK);

$("setBase").onclick = () => { mode = "base"; $("setBase").classList.add("active"); };
$("setTarget").onclick = () => { mode = "target"; $("setTarget").classList.add("active"); };
$("targets").onchange = () => {
  const t = current.targets[+$("targets").value]; if (!t) return;
  target = { lat: t.lat, lon: t.lon }; pin("target", target, Cesium.Color.ORANGE, t.name);
  invalidatePlan();
};

// -------------------------------------------------------- consumables ----
const BINDING = { oxygen: "O2 capacity", energy: "on-board energy", rated: "rated endurance" };

function specLine(spec) {
  if (!spec) return "";
  const bits = [];
  if (spec.o2_rate_kg_per_h) bits.push(`O2 ${spec.o2_rate_kg_per_h} kg/h`);
  if (spec.o2_capacity_kg) bits.push(`${spec.o2_capacity_kg} kg carried`);
  if (spec.energy_capacity_kwh) bits.push(`${spec.energy_capacity_kwh} kWh carried`);
  if (spec.energy_idle_kw) bits.push(`${spec.energy_idle_kw} kW idle`);
  if (spec.rated_hours) bits.push(`${spec.rated_hours} h rated`);
  return bits.join(" · ");
}

function pctLabel(pct) { return pct >= 999 ? "999+%" : `${Math.round(pct)}%`; }

function barRow(name, used, max, unit, pct) {
  const over = pct > 100;
  const width = Math.min(100, Math.max(1.5, pct));
  return `<div class="crow${over ? " over" : ""}">
      <div class="top"><span class="nm">${name}</span>
        <span class="val">${used.toFixed(2)} / ${max.toFixed(2)} ${unit} <b>${pctLabel(pct)}</b></span></div>
      <div class="bar" role="progressbar" aria-label="${name} used" aria-valuemin="0" aria-valuemax="100"
           aria-valuenow="${Math.min(100, Math.round(pct))}"><i style="width:${width}%"></i></div>
    </div>`;
}

function renderConsumables() {
  const box = $("consumes");
  const head = `<div class="cons-spec">${specLine(SPECS[$("vehicle").value])}</div>`;
  if (!lastPlan) {                       // nothing planned yet, or the inputs moved
    box.innerHTML = head + (replanHint ? `<div class="cons-spec">${replanHint}</div>` : "");
    return;
  }
  const s = lastPlan.stats;
  if (!s) {                              // planned, but no route exists
    box.innerHTML = head + '<div class="cons-spec">No route under these limits - nothing to consume.</div>';
    return;
  }
  let rows = "";
  if (s.o2_used_kg != null) rows += barRow("O2", s.o2_used_kg, s.o2_max_kg, "kg", s.o2_pct);
  if (s.energy_used_kwh != null) rows += barRow("Energy", s.energy_used_kwh, s.energy_max_kwh, "kWh", s.energy_pct);
  const overCap = (s.o2_pct || 0) > 100 || (s.energy_pct || 0) > 100;
  const overTime = s.within_budget === false;
  const range = s.max_range_km != null ? `max ${s.max_range_km.toFixed(1)} km out and back` : "";
  const chip = overCap ? "over capacity"
    : overTime ? "over time budget"
    : `${BINDING[s.limiting_factor] || s.limiting_factor || "limit"} binds`;
  box.innerHTML = head + rows +
    `<div class="cons-foot"><span>${range}</span>` +
    `<span class="chip${overCap || overTime ? " over" : ""}">${chip}</span></div>` +
    '<div class="cons-spec">Amounts are the round trip.</div>';
}

function applyVehicleLimits() {
  const spec = SPECS[$("vehicle").value] || {};
  const el = $("budget");
  el.max = Math.min(12, Math.max(1, spec.rated_hours || 8));   // you cannot plan past the vehicle's rating
  if (+el.value > +el.max) el.value = el.max;
  labels();
}

function invalidatePlan() {
  ++planRequest;
  if (!lastPlan && !planBusy) return;
  planBusy = false;
  lastPlan = null;
  replanHint = "Conditions changed - plan again.";
  marks.removeById("route");
  if (displayedLayer === "walkback") {
    clearOverlay();
    weatherDisplay.renderLegend({ bar: $("legend"), text: $("legendText") });
  }
  $("warn").textContent = "";
  $("explain").textContent = replanHint;
  renderConsumables();
}

// ------------------------------------------------------------------ plan ----
$("plan").onclick = async () => {
  if (!base || !target) { $("warn").textContent = "Set a base and a target first."; return; }
  $("explain").textContent = "Planning…"; $("warn").textContent = "";
  const planId = ++planRequest;
  planBusy = true;
  const requestAtStart = layerRequest;
  try {
    const res = await api("/api/plan", { ...conditions(), base, target });
    if (planId !== planRequest) return;
    if (requestAtStart === layerRequest) {
      const request = ++layerRequest;
      layerLoad?.abort();
      $("layer").value = "";
      wasGlobal = false;
      timeline?.setEnabled(false);
      windMotion.stop();
      updateWindControl();
      hideHover();
      $("layerStatus").textContent = "";
      $("retryLayer").hidden = true;
      weatherDisplay.renderLegend({ bar: $("legend"), text: $("legendText") });
      if (await showImage(res.walkback_image, res.rect, request, () => planId === planRequest)) {
        displayedLayer = "walkback";
        $("legendText").textContent = "Shaded terrain marks the round-trip walk-back zone.";
      }
    }
    if (planId !== planRequest) return;
    marks.removeById("route");
    if (res.route) {
      marks.add({ id: "route", polyline: {
        positions: Cesium.Cartesian3.fromDegreesArray(res.route.flatMap((p) => [p.lon, p.lat]), MARS),
        width: 4, material: Cesium.Color.YELLOW, clampToGround: true } });
    }
    $("warn").textContent = res.warnings.join("\n");
    $("explain").textContent = res.explanation +
      (res.stats ? `\n\nMax slope ${res.stats.max_slope_deg}°, mean ${res.stats.mean_slope_deg}°` : "") +
      "\nGreen area = places you can reach and still return within the budget.";
    lastPlan = { stats: res.stats || null };
    replanHint = "";
    renderConsumables();
  } catch (e) {
    if (planId !== planRequest) return;
    $("explain").textContent = e.message;
    lastPlan = null;
    renderConsumables();
  } finally {
    if (planId === planRequest) planBusy = false;
  }
};

// ------------------------------------------------------------------ boot ----
function flyTo(r) {
  viewer.camera.flyTo({ destination: Cesium.Rectangle.fromDegrees(r.west, r.south, r.east, r.north) });
}
function showWholeMars() {
  const canvas = viewer.scene.canvas;
  const aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
  const halfAngle = Math.atan(Math.tan(viewer.camera.frustum.fov / 2) * Math.min(aspect, 1 / aspect) * 0.91);
  const distance = MARS.maximumRadius * (1 / Math.sin(halfAngle) - 1);
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(15, 4, distance, MARS),
    orientation: { heading: 0, pitch: -Math.PI / 2, roll: 0 },
  });
}
function globalLayerSelected() {
  return $("layer").selectedOptions[0]?.parentElement.tagName === "OPTGROUP";
}
let wasGlobal = globalLayerSelected();
showWholeMars();
$("wholeMars").onclick = () => {
  $("layer").value = "global_temperature";
  wasGlobal = true;
  showWholeMars();
  timeline?.setEnabled(true);
  refreshLayer();
};
$("zoomRegion").onclick = () => { if (current) flyTo(current.rect); };
["hour", "ls", "budget"].forEach((id) => $(id).addEventListener("input", labels));
["hour", "ls", "vehicle"].forEach((id) => $(id).addEventListener("change", () => {
  if (id === "vehicle") applyVehicleLimits();
  invalidatePlan();
  if (id === "vehicle") renderConsumables();
  timeline?.stop();
  timeline?.sync();
  refreshLayer();
}));
$("layer").onchange = () => {
  const isGlobal = globalLayerSelected();
  if (isGlobal && !wasGlobal) showWholeMars();
  else if (!isGlobal && $("layer").value && current) flyTo(current.rect);
  wasGlobal = isGlobal;
  timeline?.setEnabled(isGlobal);
  refreshLayer();
};
["budget", "region"].forEach((id) => $(id).addEventListener("change", invalidatePlan));
$("region").onchange = () => {
  current = regions.find((r) => r.region === $("region").value);
  $("targets").innerHTML = '<option value="">…or pick a science target</option>' +
    current.targets.map((t, i) => `<option value="${i}">${t.name}</option>`).join("");
  if (!globalLayerSelected()) flyTo(current.rect);
  $("status").textContent = `${current.size[0]}×${current.size[1]} px · ~${current.pixel_m[1]} m/px · ` +
    `bands: ${current.bands.join(", ")}`;
  refreshLayer();
};
labels();
api("/api/weather/calendar").then(calendar => {
  timeline = createWeatherTimeline({
    calendar,
    controls: { group: $("timeline"), start: $("startSol"), end: $("endSol"),
      position: $("timelinePosition"), play: $("playTimeline"), message: $("timelineMessage"),
      readout: $("timelineReadout"), note: $("timelineNote") },
    readSeason: () => +$("ls").value,
    showSol: ls => { $("ls").value = ls; labels(); invalidatePlan(); return refreshLayer(); },
  });
  timeline.setEnabled(globalLayerSelected());
}).catch(error => {
  $("timeline").hidden = false;
  for (const id of ["startSol", "endSol", "timelinePosition", "playTimeline"]) $(id).disabled = true;
  $("timelineMessage").textContent = "Timeline could not load. " + error.message;
});
(async () => {
  try {
    const meta = await api("/api/regions");
    regions = meta.regions;
    Object.assign(SPECS, meta.vehicle_specs || {});
    $("vehicle").innerHTML = Object.entries(meta.vehicles).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
    $("region").innerHTML = regions.map((r) => `<option>${r.region}</option>`).join("");
    applyVehicleLimits();
    renderConsumables();
    if (regions.length) $("region").onchange();
    else {
      $("status").textContent = "Global view available. Load a region cube for route planning.";
      refreshLayer();
    }
  } catch (e) {
    $("status").textContent = "Regional layers could not load: " + e.message;
    if (globalLayerSelected()) refreshLayer();
  }
})();
</script>
</body>
</html>
