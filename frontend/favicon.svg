<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Computer on fire</title>
  <defs>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e0401a"/>
      <stop offset=".55" stop-color="#f7943a"/>
      <stop offset="1" stop-color="#ffd25a"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#fff3b0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2a18"/>
      <stop offset="1" stop-color="#1c1d22"/>
    </linearGradient>
  </defs>
  <!-- flames rising from the top of the monitor -->
  <path fill="url(#flame)" d="M9 30C7 22 11 17 15 13c0 5 2 7 4 8-1-7 3-13 9-18-1 7 2 10 5 13 1-4 3-7 6-9-1 5 1 8 4 11 2-3 4-4 7-5-2 4-1 7 1 10 3-2 5-2 7-2-3 4-3 8-4 11z"/>
  <path fill="url(#core)" d="M20 30c-1-5 1-8 4-10 0 3 1 4 3 5 0-5 2-8 6-11-1 5 1 7 3 9 1-2 3-3 5-4-1 4 0 7 2 9 2-1 3-1 5-1-2 2-2 3-2 3z"/>
  <!-- monitor -->
  <rect x="5" y="27" width="54" height="29" rx="4" fill="#2a2b31" stroke="#f7943a" stroke-width="2.5"/>
  <rect x="10" y="31" width="44" height="20" rx="1.5" fill="url(#screen)"/>
  <!-- glowing cracks on the screen -->
  <path d="M18 35l5 5-3 4 6 4M44 34l-4 5 4 3-3 5" fill="none" stroke="#f7943a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <!-- stand -->
  <path d="M27 56h10l2 5H25z" fill="#2a2b31" stroke="#f7943a" stroke-width="2" stroke-linejoin="round"/>
</svg>
